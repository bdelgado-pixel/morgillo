{% load i18n %}
{% if cl.search_fields %}<div id="toolbar"><form id="changelist-search" method="get" role="search"><div><label for="searchbar" class="mg-search-label">{% include 'admin/morgillo/icon.html' with name='search' %}<span class="visually-hidden">Buscar registros</span></label><input type="search" size="40" name="{{ search_var }}" value="{{ cl.query }}" id="searchbar" placeholder="Buscar en esta sección…"{% if cl.search_help_text %} aria-describedby="searchbar_helptext"{% endif %}><input type="submit" value="Buscar">{% for key, values in cl.filter_params.items %}{% if key != search_var %}{% for value in values %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}{% endif %}{% endfor %}</div>{% if cl.search_help_text %}<div class="help" id="searchbar_helptext">{{ cl.search_help_text }}</div>{% endif %}</form></div>{% endif %}
